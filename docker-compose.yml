networks:
  smarttraffic-net:
    driver: bridge

services:

  # ═══════════════════════════════════════════
  # AUTH SERVER - Zona de Autoridad
  # ═══════════════════════════════════════════
  auth_server:
    build: ./auth_server
    container_name: auth_server
    networks:
      - smarttraffic-net
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ═══════════════════════════════════════════
  # KAFKA (KRaft - sin Zookeeper) - Zona de Datos
  # ═══════════════════════════════════════════
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    networks:
      - smarttraffic-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════
  # RABBITMQ - Zona de Datos
  # ═══════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    networks:
      - smarttraffic-net
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ═══════════════════════════════════════════
  # TRAFFIC SENSOR - Zona de Ingesta (Edge)
  # ═══════════════════════════════════════════
  traffic_sensor:
    build: ./traffic_sensor
    container_name: traffic_sensor
    networks:
      - smarttraffic-net
    environment:
      AUTH_SERVER_URL: http://auth_server:5000
      KAFKA_BROKERS: kafka:9092
    depends_on:
      auth_server:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ═══════════════════════════════════════════
  # TRAFFIC PROCESSOR - Zona de Procesamiento
  # ═══════════════════════════════════════════
  traffic_processor:
    build: ./traffic_processor
    container_name: traffic_processor
    networks:
      - smarttraffic-net
    environment:
      AUTH_SERVER_URL: http://auth_server:5000
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      auth_server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ═══════════════════════════════════════════
  # ALERT DISPATCHER - Zona de Aplicación
  # ═══════════════════════════════════════════
  alert_dispatcher:
    build: ./alert_dispatcher
    container_name: alert_dispatcher
    networks:
      - smarttraffic-net
    environment:
      AUTH_SERVER_URL: http://auth_server:5000
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      auth_server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ═══════════════════════════════════════════
  # DASHBOARD BACKEND - Zona de Aplicación
  # ═══════════════════════════════════════════
  dashboard_backend:
    build: ./dashboard_backend
    container_name: dashboard_backend
    networks:
      - smarttraffic-net
    ports:
      - "3000:3000"
    environment:
      AUTH_SERVER_URL: http://auth_server:5000
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      auth_server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  kafka-data:
  rabbitmq-data: